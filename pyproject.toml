[project]
name = "cosmic-mart"
version = "0.1.0"
description = "Multi-agent supply chain architecture for Cosmic Mart"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
cosmic-mart = "cosmic_mart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmic_mart"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
